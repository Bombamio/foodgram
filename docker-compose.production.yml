volumes:
  pg_data:
  static:
  media:
 
services:
  db:
    image: postgres:14
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
  backend:
    image: bombamio/foodgram_backend:latest
    env_file: .env
    depends_on:
      - db
    volumes:
      - static:/backend_static
      - media:/media
  frontend:
    image: bombamio/foodgram_frontend:latest
    command: cp -r /app/build/. /frontend_static/
    volumes: 
      - static:/frontend_static
  gateway:
    image: bombamio/foodgram_gateway:latest
    env_file: .env
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - static:/gateway_static
      - media:/media